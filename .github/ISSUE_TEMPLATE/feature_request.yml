name: Feature request
description: A missing endpoint, field or convenience
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The workflow you are building, not only the API call you are missing.
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: The Roistat method, if you know it
      placeholder: "POST /project/analytics/data"

  - type: textarea
    id: docs
    attributes:
      label: Where it is documented
      description: >
        A link to help-en.roistat.com. Several sections exist only in the Russian original
        at help-ru.roistat.com, and a few of those are reachable only through the Wayback
        Machine, so a quote from the page helps when the link does not open.
        Speech analytics, the virtual PBX, media plans, emailtracking, the lead catcher,
        managers, billing, SMS reports and project indicators are not covered yet — say
        what you need and it can be added.
