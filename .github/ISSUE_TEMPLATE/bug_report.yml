name: Bug report
description: Something in the node behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Issues here are public. Remove the API key and the project number before pasting
        anything, and strip customer names, phone numbers and call recordings out of any
        sample payload.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The n8n version and the version of this package.
      placeholder: "n8n 2.3.1, n8n-nodes-roistat 0.1.1"
    validations:
      required: true

  - type: dropdown
    id: node
    attributes:
      label: Which node
      options:
        - Roistat
        - Roistat Trigger
    validations:
      required: true

  - type: dropdown
    id: resource
    attributes:
      label: Which resource
      options:
        - Analytics
        - Deal
        - Lead
        - Site Lead
        - Client
        - Call
        - Visit
        - Advertising Cost
        - Event
        - Statistic
        - Project
        - Not applicable (trigger)
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Operation
      placeholder: "Get Report"

  - type: textarea
    id: response
    attributes:
      label: What Roistat answered
      description: >
        The body, not only the status code. Roistat replies 200 OK to failures unless the
        request carries Use-Http-Code, the node always sends it, and the real reason lives
        in the description field rather than in message.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        For a report: the metrics, dimensions and period. For the trigger: which Roistat
        feature calls the URL, calltracking or a marketing automation scenario, and one
        sample payload with the personal data removed.
